<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agentry hub</title>
<script>try { const t = localStorage.getItem('kit-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
<style>
:root {
  color-scheme: light;
  --bg: #f6f7fb; --panel: #ffffff; --sunken: #f0f2f7; --hover: #e9ecf4; --line: #e4e7ef; --line-strong: #d3d8e4;
  --text: #161a23; --muted: #646d82; --faint: #98a0b3;
  --accent: #5b5bd6; --accent-ink: #ffffff; --accent-soft: #ececfd;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626; --info: #2563eb; --violet: #7c3aed;
  --add-bg: #e7f7ec; --del-bg: #fdecec; --hunk: #6d4ad8;
  --term-bg: #0f1218; --term-text: #d2d8e4;
  --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05); --shadow: 0 1px 3px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .05);
  --shadow-lg: 0 12px 40px rgba(16, 24, 40, .18);
  --radius: 12px; --radius-sm: 8px;
  --sans: "Inter", "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "JetBrains Mono", "Cascadia Code", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0c0e13; --panel: #14171f; --sunken: #1a1e28; --hover: #222736; --line: #252a37; --line-strong: #333a4c;
    --text: #e6e8ee; --muted: #8e96aa; --faint: #616a80;
    --accent: #8d8ef7; --accent-ink: #0c0e1d; --accent-soft: #23244a;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa; --violet: #a78bfa;
    --add-bg: #11291a; --del-bg: #351619; --hunk: #b9a2fc;
    --term-bg: #090b0f; --shadow-sm: none; --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset; --shadow-lg: 0 16px 48px rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0c0e13; --panel: #14171f; --sunken: #1a1e28; --hover: #222736; --line: #252a37; --line-strong: #333a4c;
  --text: #e6e8ee; --muted: #8e96aa; --faint: #616a80;
  --accent: #8d8ef7; --accent-ink: #0c0e1d; --accent-soft: #23244a;
  --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa; --violet: #a78bfa;
  --add-bg: #11291a; --del-bg: #351619; --hunk: #b9a2fc;
  --term-bg: #090b0f; --shadow-sm: none; --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset; --shadow-lg: 0 16px 48px rgba(0, 0, 0, .6);
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; font: 14px/1.5 var(--sans); color: var(--text); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-decoration: none; } a:hover { text-decoration: underline; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
::selection { background: color-mix(in srgb, var(--accent) 30%, transparent); }

.ic { width: 16px; height: 16px; flex: none; vertical-align: -3px; }
button, .btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius-sm);
  padding: 6px 12px; cursor: pointer; white-space: nowrap; font-weight: 500; font-size: 13px; box-shadow: var(--shadow-sm); transition: background .12s, border-color .12s, transform .05s; color: var(--text); }
button:hover, .btn:hover { background: var(--hover); text-decoration: none; }
button:active { transform: translateY(1px); }
button.primary, .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover, .btn.primary:hover { background: color-mix(in srgb, var(--accent) 88%, var(--text)); }
button.danger { color: var(--bad); }
button.danger:hover { background: color-mix(in srgb, var(--bad) 10%, var(--panel)); border-color: color-mix(in srgb, var(--bad) 40%, var(--line)); }
button.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--muted); }
button.ghost:hover { background: var(--hover); color: var(--text); }
button.small, .btn.small { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
button.icon { padding: 6px; }
button:disabled { opacity: .5; cursor: default; }

input, select, textarea { border: 1px solid var(--line-strong); background: var(--panel); border-radius: var(--radius-sm); padding: 7px 10px; width: 100%; transition: border-color .12s, box-shadow .12s; }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
input[type=checkbox], input[type=radio] { width: auto; accent-color: var(--accent); }
textarea { font-family: var(--mono); font-size: 12.5px; line-height: 1.55; resize: vertical; }
label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin: 12px 0 5px; }
pre { margin: 0; font-family: var(--mono); font-size: 12.5px; white-space: pre-wrap; word-break: break-word; }
code { font-family: var(--mono); font-size: 12px; background: var(--sunken); border: 1px solid var(--line); padding: 1px 6px; border-radius: 5px; }
h2 { font-size: 19px; font-weight: 650; letter-spacing: -.01em; margin: 0; }
h3 { font-size: 11.5px; font-weight: 600; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }

/* shell */
header { display: flex; align-items: center; gap: 16px; padding: 10px 24px; background: color-mix(in srgb, var(--panel) 85%, transparent);
  backdrop-filter: saturate(1.6) blur(10px); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: -.01em; font-size: 15px; color: var(--text); }
.brand:hover { text-decoration: none; }
.logo { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; color: #fff;
  background: linear-gradient(135deg, #7c7cf2, #5b5bd6 55%, #8b5cf6); box-shadow: 0 2px 8px rgba(91, 91, 214, .35); }
.brand small { font-weight: 500; color: var(--muted); font-size: 12px; }
nav { display: flex; gap: 2px; padding: 3px; background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
nav a { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px; border-radius: 7px; color: var(--muted); font-weight: 500; font-size: 13px; white-space: nowrap; }
nav a:hover { color: var(--text); text-decoration: none; }
nav a.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
.count { font-size: 11px; font-weight: 600; min-width: 18px; padding: 0 6px; height: 18px; line-height: 18px; text-align: center; border-radius: 9px; background: var(--hover); color: var(--muted); }
.count.hot { background: var(--accent); color: var(--accent-ink); }
.grow { flex: 1; }
.loop { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--muted); padding: 4px 4px 4px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); }
.loop button { border-radius: 999px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--faint); flex: none; }
.dot.on { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.dot.paused { background: var(--warn); }
main { padding: 24px 24px 64px; max-width: 1560px; margin: 0 auto; }
@media (max-width: 760px) {
  header { flex-wrap: wrap; padding: 10px 16px; gap: 10px; }
  header nav { order: 5; width: 100%; }
  .brand small, .loop .txt { display: none; }
  main { padding: 16px 16px 48px; }
}

.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); }
.muted { color: var(--muted); } .faint { color: var(--faint); } .small { font-size: 12.5px; } .mono { font-family: var(--mono); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 900px) { .split { grid-template-columns: 1fr; } }
.pagehead { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.pagehead p { margin: 4px 0 0; }

/* pills & chips */
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 500; padding: 2px 9px 2px 8px; border-radius: 999px; white-space: nowrap;
  color: var(--tone); background: color-mix(in srgb, var(--tone) 12%, transparent); border: 1px solid color-mix(in srgb, var(--tone) 22%, transparent); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.pill .ic { width: 13px; height: 13px; vertical-align: 0; }
.pill.live i { animation: pulse 1.2s infinite; }
.t-neutral { --tone: var(--muted); } .t-accent { --tone: var(--accent); } .t-warn { --tone: var(--warn); } .t-bad { --tone: var(--bad); }
.t-ok { --tone: var(--ok); } .t-info { --tone: var(--info); } .t-violet { --tone: var(--violet); }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 6px; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
a.chip:hover { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); text-decoration: none; }
.b-ok { color: var(--ok); } .b-modified { color: var(--warn); } .b-missing, .b-over { color: var(--bad); }
@keyframes pulse { 50% { opacity: .25; } }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-bottom: 20px; }
@media (max-width: 900px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.stat { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); color: var(--text); display: block; }
a.stat:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); text-decoration: none; }
.stat span { font-size: 12px; color: var(--muted); font-weight: 500; display: flex; align-items: center; gap: 6px; }
.stat b { display: block; font-size: 24px; font-weight: 650; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }

/* workflow stepper */
.flow { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.step { flex: 1; min-width: 118px; display: flex; gap: 9px; align-items: flex-start; padding: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; position: relative; }
.step .num { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 650; background: var(--sunken); color: var(--muted); border: 1px solid var(--line); }
.step b { display: block; font-size: 12.5px; font-weight: 600; }
.step .d { display: flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); line-height: 1.35; }
.step .eng { width: 7px; height: 7px; border-radius: 2px; flex: none; }
.step.claude .eng { background: var(--violet); } .step.opencode .eng { background: var(--info); } .step.shell .eng { background: var(--faint); } .step.human .eng { background: var(--warn); }
.step.done .num { background: var(--ok); border-color: var(--ok); color: #fff; }
.step.now { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 15%, transparent); }
.step.now .num { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pulse 1.4s infinite; }
.step.stuck { border-color: color-mix(in srgb, var(--bad) 55%, var(--line)); background: color-mix(in srgb, var(--bad) 7%, var(--panel)); }
.step.stuck .num { background: var(--bad); border-color: var(--bad); color: #fff; }
.step.skip { opacity: .45; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 8px; height: 8px; border-radius: 2px; }
details.how { margin-bottom: 20px; }
details.how summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 10px; user-select: none; }
details.how summary::-webkit-details-marker { display: none; }
details.how summary::before { content: "›"; display: inline-block; transition: transform .15s; font-size: 16px; line-height: 1; }
details.how[open] summary::before { transform: rotate(90deg); }

/* board */
.toolbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.toolbar select { width: auto; min-width: 160px; padding: 5px 10px; }
.seg { display: inline-flex; padding: 3px; gap: 2px; background: var(--sunken); border: 1px solid var(--line); border-radius: 9px; }
.seg button { border: none; background: none; box-shadow: none; padding: 4px 11px; font-size: 12.5px; color: var(--muted); border-radius: 6px; }
.seg button:hover { color: var(--text); background: none; }
.seg button.on { background: var(--panel); color: var(--text); box-shadow: var(--shadow-sm), 0 0 0 1px var(--line); }
.cols { display: grid; grid-template-columns: repeat(5, minmax(230px, 1fr)); gap: 14px; overflow-x: auto; padding-bottom: 6px; }
@media (max-width: 900px) { .cols { grid-template-columns: 1fr; } }
.col { background: var(--sunken); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; min-height: 120px; }
.col h4 { margin: 2px 4px 10px; font-size: 12.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.col h4 i { width: 8px; height: 8px; border-radius: 50%; background: var(--tone); }
.card { display: block; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 11px 12px; margin-bottom: 8px; color: var(--text); cursor: pointer;
  box-shadow: var(--shadow-sm); transition: border-color .12s, box-shadow .12s, transform .12s; }
.card:hover { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); box-shadow: var(--shadow); transform: translateY(-1px); }
.card .top { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.card .id { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--muted); }
.card .t { font-weight: 550; margin: 6px 0 8px; line-height: 1.4; }
.card .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; font-size: 11.5px; color: var(--faint); }
.card .errline { font-size: 12px; color: var(--bad); margin: -2px 0 8px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.empty { text-align: center; padding: 18px 8px; color: var(--faint); font-size: 12.5px; border: 1px dashed var(--line-strong); border-radius: 10px; }
.hero { text-align: center; padding: 48px 20px; }
.hero .logo { width: 48px; height: 48px; border-radius: 14px; margin: 0 auto 14px; }
.hero p { max-width: 460px; margin: 8px auto 18px; color: var(--muted); }

/* pull requests */
.prs { padding: 0; overflow: hidden; }
.pr { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); align-items: start; }
.pr:last-child { border-bottom: none; }
.pr:hover { background: color-mix(in srgb, var(--sunken) 60%, transparent); }
.pr .ic { width: 18px; height: 18px; margin-top: 2px; }
.pr .title { font-weight: 600; color: var(--text); font-size: 14.5px; }
.pr .title:hover { color: var(--accent); }
.pr .sub { display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; font-size: 12px; color: var(--muted); margin-top: 4px; }
.pr .side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.diffstat { font-family: var(--mono); font-size: 12px; } .diffstat .a { color: var(--ok); } .diffstat .r { color: var(--bad); }
.warnbar { display: flex; gap: 8px; align-items: flex-start; font-size: 12.5px; padding: 10px 14px; border-radius: 10px; margin-bottom: 12px;
  background: color-mix(in srgb, var(--warn) 9%, var(--panel)); border: 1px solid color-mix(in srgb, var(--warn) 30%, var(--line)); }

/* ticket */
.back { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 500; }
.back:hover { color: var(--text); text-decoration: none; }
/* ticket page: sibling tickets on the left, prev/next on top */
.tlayout { display: grid; grid-template-columns: 272px minmax(0, 1fr); gap: 24px; align-items: start; }
.tside { position: sticky; top: 76px; max-height: calc(100vh - 96px); display: flex; flex-direction: column; padding: 0; overflow: hidden; }
.tside .sh { padding: 12px 12px 10px; border-bottom: 1px solid var(--line); }
.tside .sh b { display: flex; align-items: center; gap: 6px; font-size: 13px; margin-bottom: 8px; }
.tside .sh input { padding: 5px 9px; font-size: 12.5px; }
.tside .sl { overflow-y: auto; padding: 4px 6px 10px; }
.tgrp > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; padding: 12px 8px 4px; user-select: none; }
.tgrp > summary::-webkit-details-marker { display: none; }
.tgrp > summary::before { content: "›"; font-size: 13px; line-height: 1; transition: transform .15s; }
.tgrp[open] > summary::before { transform: rotate(90deg); }
.titem { display: grid; grid-template-columns: 7px 34px minmax(0, 1fr); gap: 8px; align-items: center; padding: 6px 8px; border-radius: 8px; color: var(--text); font-size: 12.5px; }
.titem:hover { background: var(--hover); text-decoration: none; }
.titem.on { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
.titem > i { width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
.titem.live > i { animation: pulse 1.2s infinite; }
.titem .id { font-family: var(--mono); font-size: 11px; font-weight: 600; color: var(--muted); }
.titem .tt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.titem.on .tt { font-weight: 600; }
.tnav { display: flex; align-items: center; gap: 6px; }
.tnav .btn { color: var(--muted); }
.tnav .btn.off { opacity: .4; pointer-events: none; }
@media (max-width: 1100px) { .tlayout { grid-template-columns: minmax(0, 1fr); } .tside { display: none; } }
.thead { margin: 12px 0 16px; }
.thead h2 { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.thead h2 .id { font-family: var(--mono); font-size: 15px; color: var(--muted); font-weight: 600; }
.metas { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); margin-top: 10px; }
.metas span { display: inline-flex; align-items: center; gap: 6px; }
.metas b { color: var(--text); font-weight: 500; }
.prbanner { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 12px 16px; border-radius: var(--radius); margin-bottom: 16px;
  background: color-mix(in srgb, var(--ok) 8%, var(--panel)); border: 1px solid color-mix(in srgb, var(--ok) 30%, var(--line)); }
.prbanner .ic { color: var(--ok); width: 20px; height: 20px; }
.prbanner a.url { font-family: var(--mono); font-size: 12.5px; word-break: break-all; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin: 16px 0 4px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin: 18px 0 16px; overflow-x: auto; }
.tabs button { border: none; box-shadow: none; border-bottom: 2px solid transparent; border-radius: 0; background: none; color: var(--muted); padding: 9px 12px; margin-bottom: -1px; }
.tabs button:hover { color: var(--text); background: none; }
.tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
.diff { font-family: var(--mono); font-size: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); overflow-x: auto; }
.diff div { white-space: pre; padding: 0 14px; min-height: 18px; line-height: 18px; }
.diff .add { background: var(--add-bg); } .diff .del { background: var(--del-bg); } .diff .hunk { color: var(--hunk); background: color-mix(in srgb, var(--hunk) 6%, transparent); }
.diff .file { background: var(--sunken); font-weight: 600; padding: 8px 14px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); font-family: var(--sans); font-size: 13px; }
.diff .file:first-child { border-top: none; }
.box { background: var(--sunken); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.logbox { background: var(--term-bg); color: var(--term-text); border-radius: var(--radius); padding: 14px 16px; max-height: 65vh; overflow: auto; border: 1px solid var(--line); }
.history { border-left: 2px solid var(--line); margin-left: 6px; padding-left: 18px; }
.history div { position: relative; padding: 6px 0 10px; font-size: 13px; }
.history div::before { content: ""; position: absolute; left: -24px; top: 11px; width: 10px; height: 10px; border-radius: 50%; background: var(--panel); border: 2px solid var(--line-strong); }
.history div:first-child::before { border-color: var(--accent); background: var(--accent); }
.history time { display: block; font-size: 11.5px; color: var(--faint); }

/* lists & tables */

/* dialog & toast */

@keyframes pop { from { opacity: 0; transform: translateY(6px) scale(.98); } }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 560px) { .choices { grid-template-columns: 1fr; } }
.choice { margin: 0; display: block; cursor: pointer; padding: 12px 14px; border: 1px solid var(--line-strong); border-radius: 10px; color: var(--text); font-size: 13px; transition: border-color .12s, background .12s; }
.choice b { display: flex; align-items: center; gap: 8px; font-size: 13.5px; }
.choice span { display: block; color: var(--muted); font-size: 12px; font-weight: 400; margin-top: 3px; }
.choice:has(input:checked) { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, var(--panel)); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 14%, transparent); }
.check { display: flex; align-items: center; gap: 8px; color: var(--text); font-size: 13px; margin: 14px 0 0; font-weight: 400; cursor: pointer; }
#toast { position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 30; }
#toast div { display: flex; gap: 10px; align-items: flex-start; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-left: 3px solid var(--ok);
  padding: 10px 14px; border-radius: 10px; max-width: 440px; white-space: pre-wrap; font-size: 13px; box-shadow: var(--shadow-lg); animation: pop .16s ease-out; }
#toast div.e { border-left-color: var(--bad); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0 16px; }
@media (max-width: 700px) { .grid2, .grid3 { grid-template-columns: 1fr; } }
.qcard { border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 12px; background: var(--panel); box-shadow: var(--shadow-sm); }
.qq { display: flex; gap: 10px; font-weight: 550; margin-bottom: 12px; line-height: 1.5; }
.qn { flex: none; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 12px; font-weight: 700; }

@keyframes spin { to { transform: rotate(360deg); } }

/* bug screenshots */
.chip.sev { color: var(--tone); background: color-mix(in srgb, var(--tone) 10%, transparent); border-color: color-mix(in srgb, var(--tone) 25%, transparent); }
.drop { margin-top: 6px; border: 1.5px dashed var(--line-strong); border-radius: 10px; padding: 14px; text-align: center; color: var(--muted); font-size: 12.5px; cursor: pointer; transition: border-color .12s, background .12s; }
.drop:hover, .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 5%, var(--panel)); }

<body>
<header>
  <a class="brand" href="#/board"><span class="logo"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M12 12l8-4.5M12 12v9M12 12L4 7.5"/></svg></span>agentry <small>hub</small></a>

  <button class="primary" onclick="newTicket()" title="New ticket (N)"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>New ticket</button>
</header>
<main id="view"></main>
<div id="toast"></div>

<dialog id="dlg"><form method="dialog" id="dlgForm"></form></dialog>

<script>
const $ = (s, el = document) => el.querySelector(s);
const js = (v) => esc(JSON.stringify(v));
const esc = (s = '') => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ago = (t) => { if (!t) return ''; const s = (Date.now() - new Date(t)) / 1000; return s < 60 ? 'just now' : s < 3600 ? `${s / 60 | 0}m ago` : s < 86400 ? `${s / 3600 | 0}h ago` : `${s / 86400 | 0}d ago`; };

const PATHS = {
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
  pr: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M13 6h3a2 2 0 0 1 2 2v7M6 9v12"/>',
  merged: '<circle cx="18" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><path d="M6 21V9a9 9 0 0 0 9 9"/>',
  prclosed: '<circle cx="6" cy="6" r="3"/><circle cx="18" cy="18" r="3"/><path d="M6 9v12M15 4l6 6M21 4l-6 6M18 13v2"/>',
  branch: '<circle cx="6" cy="18" r="3"/><circle cx="6" cy="6" r="3"/><circle cx="18" cy="6" r="3"/><path d="M6 9v6M18 9a9 9 0 0 1-9 9"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/>',
  ext: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  back: '<path d="M15 18l-6-6 6-6"/>', plus: '<path d="M12 5v14M5 12h14"/>',
  play: '<path d="M7 4l13 8-13 8z"/>', pause: '<path d="M8 5v14M16 5v14"/>', stop: '<rect x="6" y="6" width="12" height="12" rx="2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>', redo: '<path d="M3 12a9 9 0 0 1 15-6.7L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-15 6.7L3 16"/><path d="M3 21v-5h5"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  bolt: '<path d="M13 2 4 14h7l-1 8 9-12h-7z"/>', spark: '<path d="M12 3l1.9 5.8L20 11l-6.1 2.2L12 19l-1.9-5.8L4 11l6.1-2.2z"/>',
  user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>', dollar: '<path d="M12 2v20M17 6H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/>',
  list: '<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>', pen: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', image: '<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  bug: '<rect x="8" y="6" width="8" height="14" rx="4"/><path d="M19 7l-3 2M5 7l3 2M19 19l-3-2M5 19l3-2M20 13h-4M4 13h4M10 4l1 2M14 4l-1 2"/>', inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5h13L22 12v6a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2v-6z"/>',
};
const ic = (n, cls = '') => `<svg class="ic ${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${PATHS[n] || ''}</svg>`;

// status → [label, tone]
const ST = {
  backlog: ['Backlog', 'neutral'], ready: ['Queued', 'neutral'], running: ['Running', 'accent'], needs_info: ['Needs info', 'warn'],
  review: ['Ready for review', 'warn'], approved: ['Pushing…', 'info'], pr_open: ['PR open', 'ok'], failed: ['Failed', 'bad'], rejected: ['Rejected', 'neutral'], done: ['Done', 'ok'],
};
// A bug's status is read off its ticket status (one state machine, no drift): what the reporter cares about.
const BUG_ST = {
  backlog: ['Open', 'bad'], ready: ['Fixing', 'accent'], running: ['Fixing', 'accent'], needs_info: ['Needs info', 'warn'], review: ['Fix ready', 'warn'],
  approved: ['Fix in PR', 'info'], pr_open: ['Fix in PR', 'info'], failed: ['Fix failed', 'bad'], rejected: ["Won't fix", 'neutral'], done: ['Fixed', 'ok'],
};
const SEV = { low: 'neutral', medium: 'info', high: 'warn', critical: 'bad' };
const sevChip = (t) => (t.kind === 'bug' ? `<span class="chip sev t-${SEV[t.severity] || 'info'}" title="bug · ${esc(t.severity || 'medium')} severity">${ic('bug')}${esc(t.severity || 'medium')}</span>` : '');
const bugPill = (t) => { if (t.kind !== 'bug') return ''; const [l, tone] = t.status === 'done' && t.verifiedAt ? ['Verified', 'ok'] : t.status === 'done' ? ['Fixed · needs verify', 'warn'] : BUG_ST[t.status] || [t.status, 'neutral']; return `<span class="pill t-${tone}" title="bug status"><i></i>Bug: ${l}</span>`; };
const pill = (status, stage) => { const [l, tone] = ST[status] || [status, 'neutral']; return `<span class="pill t-${tone}${status === 'running' ? ' live' : ''}"><i></i>${l}${stage ? ` · ${esc(stage)}` : ''}</span>`; };
// "4m", "1h 12m" since a timestamp
const dur = (t) => { const s = Math.max(0, (Date.now() - new Date(t)) / 1000) | 0; return s < 60 ? `${s}s` : s < 3600 ? `${s / 60 | 0}m` : `${s / 3600 | 0}h ${(s % 3600) / 60 | 0}m`; };
const kTok = (n) => (n >= 1000 ? `${(n / 1000).toFixed(n >= 10000 ? 0 : 1)}k` : String(n || 0));
const tokSum = (byStep) => Object.values(byStep || {}).reduce((a, s) => ({ in: a.in + s.in, out: a.out + s.out }), { in: 0, out: 0 });
const idNum = (id) => Number(String(id).match(/(\d+)$/)?.[1] || 0);
const byIndex = (a, b) => (a.createdAt || '').localeCompare(b.createdAt || '') || idNum(a.id) - idNum(b.id); // creation order: ids are per repo (PIX-1) or legacy (T37)
const prNum = (url) => ((url || '').match(/\/pull\/(\d+)/) || [])[1];

async function api(method, path, body) {
  const res = await fetch(`/api/${path}`, { method, headers: method === 'GET' ? {} : { 'content-type': 'application/json', 'x-kit-ui': '1' }, body: body === undefined ? undefined : JSON.stringify(body) });
  const j = await res.json().catch(() => ({ error: `HTTP ${res.status}` }));
  if (!res.ok) throw new Error(j.error || `HTTP ${res.status}`);
  return j;
}
function toast(msg, isErr) {
  const d = document.createElement('div'); d.textContent = msg; if (isErr) d.className = 'e';
  $('#toast').append(d); setTimeout(() => d.remove(), isErr ? 7000 : 3000);
}
const guard = (fn) => async (...a) => { try { return await fn(...a); } catch (e) { toast(e.message, true); } };

let S = null;            // /api/state
let P = null;            // /api/prs
let page = { v: 'board', sel: new Set() };

// ---------------- theme ----------------
const THEMES = [['system', 'monitor', 'System theme'], ['light', 'sun', 'Light theme'], ['dark', 'moon', 'Dark theme']];
function theme(set) {
  let cur = 'system';
  try { cur = localStorage.getItem('kit-theme') || 'system'; } catch { /* storage blocked */ }
  if (set) { cur = set; try { localStorage.setItem('kit-theme', set); } catch { /* storage blocked */ } }
  if (cur === 'system') delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = cur;
  const [, icon, label] = THEMES.find(([k]) => k === cur) || THEMES[0];
  $('#themeBtn').innerHTML = ic(icon); $('#themeBtn').title = `${label} — click to switch`;
  return cur;
}
$('#themeBtn').onclick = () => { const i = THEMES.findIndex(([k]) => k === theme()); const next = THEMES[(i + 1) % THEMES.length]; theme(next[0]); toast(next[2]); };
theme();

// ---------------- workflow strip ----------------
// Which optional stages a repo has (test, evidence, publish, notify); the board shows any repo's.
const repoFlags = (name) => S.repos.find((r) => r.name === name)?.flags || {};
const anyFlags = () => S.repos.reduce((a, r) => { for (const k in r.flags) a[k] ||= r.flags[k]; return a; }, {});
const notifyLabel = () => S.config.ui.notifyLabel || 'Notify';
function stages(cfg, f = anyFlags()) {
  const e = cfg.engines;
  const m = (x) => `${x.tool}${x.agent ? ` · ${x.agent}` : x.model ? ` · ${x.model}` : ''}`;
  const st = [
    { k: 'setup', n: 'Setup', d: 'install deps', c: 'shell' },
    { k: 'plan', n: 'Plan', d: m(e.plan), c: e.plan.tool },
    { k: 'code', n: 'Code', d: `${m(e.code)}${e.escalate?.after > 0 ? ` → ${e.escalate.model} after ${e.escalate.after} fail${e.escalate.after > 1 ? 's' : ''}` : ''}`, c: e.code.tool },
    { k: 'verify', n: 'Verify', d: 'your build check', c: 'shell' },
    { k: 'review', n: 'Review', d: `${m(e.review)} · skip <${cfg.review.skipUnderLines} lines`, c: e.review.tool },
  ];
  if (f.test) st.push({ k: 'test', n: 'Test', d: m(e.test), c: e.test.tool });
  if (!f.publish) return [...st, { k: 'commit', n: 'Commit', d: 'local branch only', c: 'shell' }, { k: 'human', n: 'You review', d: 'test the worktree', c: 'human' }, { k: 'pr', n: 'Push + PR', d: 'after you approve', c: 'human' }];
  if (f.evidence) st.push({ k: 'evidence', n: 'Evidence', d: 'repo command', c: 'shell' });
  st.push({ k: 'publish', n: 'Publish', d: 'commit · push · PR', c: 'shell' });
  if (f.notify) st.push({ k: 'notify', n: notifyLabel(), d: 'when you click', c: 'human' });
  return st;
}
function flow(cfg, t) {
  const st = stages(cfg, t ? repoFlags(t.repo) : undefined);
  const idx = (k) => st.findIndex((s) => s.k === k);
  let now = -1, doneUpTo = -1, stuck = -1;
  if (t) {
    if (t.status === 'running') { now = Math.max(0, idx(t.stage || 'setup')); doneUpTo = now - 1; }
    else if (t.status === 'review') { now = idx('human'); doneUpTo = now - 1; }
    else if (t.status === 'approved') { now = idx('pr'); doneUpTo = now - 1; }
    else if (t.status === 'pr_open' && idx('notify') >= 0 && !t.notifiedAt) { now = idx('notify'); doneUpTo = now - 1; }
    else if (['pr_open', 'done'].includes(t.status)) doneUpTo = st.length - 1;
    else if (t.status === 'needs_info') { stuck = idx('plan'); doneUpTo = stuck - 1; }
    else if (t.status === 'failed' && ['evidence', 'publish'].includes(t.resume)) { stuck = Math.max(0, idx(t.resume)); doneUpTo = stuck - 1; }
    else if (t.status === 'failed') { const h = (t.history || []).map((x) => x.text).reverse().find((x) => /^(verify|plan|code|review|setup|commit|tests)/.test(x)) || ''; stuck = Math.max(0, idx(((h.match(/^(\w+)/) || [])[1] || '').replace('tests', 'test'))); doneUpTo = stuck - 1; }
  }
  return `<div class="flow">${st.map((s, i) => {
    const skip = t && t.mode === 'quick' && s.k === 'plan';
    const cls = [s.c, i === now ? 'now' : '', i <= doneUpTo ? 'done' : '', i === stuck ? 'stuck' : '', skip ? 'skip' : ''].join(' ');
    const loop = s.k === 'code' ? ` <span class="faint" title="code ⇄ verify ⇄ fix up to ${cfg.limits.fixIterations}×, review fix ${cfg.limits.reviewRounds}×">↺</span>` : '';
    const num = i <= doneUpTo ? '✓' : i === stuck ? '!' : i + 1;
    const took = i === now && t?.status === 'running' && t.stageAt ? ` <span class="faint" style="font-weight:500">· ${dur(t.stageAt)}</span>` : '';
    return `<div class="step ${cls}"><span class="num">${num}</span><div><b>${s.n}${loop}${took}</b><span class="d"><i class="eng"></i>${esc(skip ? 'skipped (quick)' : s.d)}</span></div></div>`;
  }).join('')}</div>`;
}
const legend = '<div class="legend"><span><i style="background:var(--violet)"></i>Claude</span><span><i style="background:var(--info)"></i>OpenCode</span><span><i style="background:var(--faint)"></i>no tokens</span><span><i style="background:var(--warn)"></i>you</span></div>';

// ---------------- board ----------------
const COLS = [
  ['Queued', ['backlog', 'ready'], 'neutral'], ['Running', ['running'], 'accent'], ['Needs you', ['needs_info', 'review', 'failed'], 'warn'],
  ['Shipping', ['approved', 'pr_open'], 'ok'], ['Closed', ['done', 'rejected'], 'neutral'],
];
function viewBoard() {
  const repo = page.repo || '';

async function loadLog(name) {
  const { text, total, mtime } = await api('GET', `tickets/${T.id}/logs/${encodeURIComponent(name)}?tail=500`);
  const el = $('#logtext');
  if (!el) return;
  const meta = $('#logmeta');
  if (meta) {
    const live = T.status === 'running' && name === page.logLatest;
    const idle = (Date.now() - mtime) / 1000;
    meta.innerHTML = !live ? (mtime ? `written ${ago(mtime)}` : '')
      : idle > 300 ? `<span style="color:var(--warn)">● no output for ${dur(mtime)} — the model is slow or stuck</span>`
      : `<span class="pill t-accent live"><i></i>live</span> last output ${idle < 5 ? 'just now' : `${dur(mtime)} ago`}`;
  }
  const stick = el.parentElement.scrollTop + el.parentElement.clientHeight >= el.parentElement.scrollHeight - 30;
  el.textContent = (total > 500 ? `… ${total - 500} earlier lines\n` : '') + (text || '(empty)');
  if (stick) el.parentElement.scrollTop = el.parentElement.scrollHeight;
}
function renderDiff(text) {
  return `<div class="diff">${text.split('\n').map((l) => {
    if (l.startsWith('diff --git')) return `<div class="file">${esc(l.replace(/^diff --git a\/(.*) b\/.*/, '$1'))}</div>`;
    if (/^(index |--- |\+\+\+ )/.test(l)) return '';
    const c = l.startsWith('@@') ? 'hunk' : l.startsWith('+') ? 'add' : l.startsWith('-') ? 'del' : '';
    return `<div class="${c}">${esc(l)}</div>`;
  }).join('')}</div>`;
}

// ---------------- screenshots ----------------
// Resized here before upload: Claude bills an image at ~1 token per 28×28 px, so 1568px wide ≈ 1.8k tokens
// instead of ≈ 4.8k at the model's 2576px limit, and text in UI screenshots stays readable.
const SHOT_MAX_EDGE = 1568, SHOT_MAX = 6;
const readUrl = (f) => new Promise((ok, no) => { const r = new FileReader(); r.onload = () => ok(r.result); r.onerror = no; r.readAsDataURL(f); });
const shotTokens = (s) => Math.ceil((s.w * s.h) / 784);
async function shrink(file) {
  const bmp = await createImageBitmap(file);
  const k = Math.min(1, SHOT_MAX_EDGE / Math.max(bmp.width, bmp.height));
  const w = Math.round(bmp.width * k), h = Math.round(bmp.height * k);
  if (k === 1 && file.size < 1.5e6 && /^image\/(png|jpeg|webp)$/.test(file.type)) return { url: await readUrl(file), w, h };
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  c.getContext('2d').drawImage(bmp, 0, 0, w, h);
  let url = c.toDataURL('image/png');
  if (url.length > 2e6) url = c.toDataURL('image/jpeg', 0.88); // photos / busy pages: PNG gets big
  return { url, w, h };
}
// Drop zone + thumbnails inside el; also takes Ctrl+V anywhere in the open dialog.
function shotPicker(el, max = SHOT_MAX) {
  const shots = [];
  const add = guard(async (files) => {
    for (const f of [...files].filter((x) => x.type.startsWith('image/'))) {
      if (shots.length >= max) { toast(`At most ${max} screenshots per ticket`, true); break; }
      shots.push(await shrink(f));
    }
    draw();
  });
  const draw = () => {
    el.innerHTML = `<div class="drop" tabindex="0">${ic('image')} Paste <kbd>Ctrl</kbd> + <kbd>V</kbd>, drop, or <u>choose</u> screenshots <span class="faint">· up to ${max} · resized to ≤${SHOT_MAX_EDGE}px</span></div>
      <input type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
      ${shots.length ? `<div class="shots">${shots.map((s, i) => `<div class="shot"><img src="${s.url}" alt="screenshot ${i + 1}"><button type="button" class="icon ghost small" data-i="${i}" title="Remove">${ic('x')}</button><span>${s.w}×${s.h} · ≈${kTok(shotTokens(s))} tok</span></div>`).join('')}</div>` : ''}`;
    const drop = $('.drop', el), input = $('input[type=file]', el);
    drop.onclick = () => input.click();
    drop.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); input.click(); } };
    input.onchange = () => add(input.files);
    drop.ondragover = (e) => { e.preventDefault(); drop.classList.add('over'); };
    drop.ondragleave = () => drop.classList.remove('over');
    drop.ondrop = (e) => { e.preventDefault(); drop.classList.remove('over'); add(e.dataTransfer.files); };
    el.querySelectorAll('.shot button').forEach((b) => { b.onclick = () => { shots.splice(+b.dataset.i, 1); draw(); }; });
  };
  $('#dlgForm').onpaste = (e) => { const fs = [...(e.clipboardData?.files || [])]; if (fs.length) { e.preventDefault(); add(fs); } };
  draw();
  return { urls: () => shots.map((s) => s.url) };
}

// ---------------- plan tickets (import plan files / generate with Claude) ----------------
let PL = { repo: '', tab: 'import', files: null, job: null, list: [], timer: null };
function planTickets(repo) {
  if (!S.repos.length) { toast('Add a repo first (Repos tab)', true); return; }
  repo = repo || (page.v === 'repos' && page.name) || page.repo || S.repos[0].name;
  if (PL.repo !== repo) PL = { ...PL, repo, files: null, job: null };
  const dlg = $('#dlg'); dlg.onclose = () => clearInterval(PL.timer); dlg.style.width = 'min(860px, 94vw)';
  $('#dlgForm').onkeydown = (e) => { if (e.key === 'Enter' && e.target.tagName === 'INPUT') e.preventDefault(); }; // Enter in a title must not close it
  $('#dlgForm').innerHTML = `<div class="row"><h2>Plan tickets</h2><select id="plRepo" style="width:auto">${S.repos.map((r) => `<option ${r.name === repo ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select>
      <span class="grow"></span><button class="icon ghost" value="cancel" formnovalidate title="Close">${ic('x')}</button></div>
    <p class="small muted" style="margin:6px 0 12px">Turn a plan into tickets. You review and edit them first; nothing is created until you press Add.</p>
    <div class="seg" id="plTabs"></div><div id="plBody" class="plbody"></div><div id="plFoot"></div>`;
  $('#plRepo').onchange = (e) => planTickets(e.target.value);
  if (!dlg.open) dlg.showModal();
  drawPlan();
  if (!PL.files) api('GET', `repos/${encodeURIComponent(repo)}/plans`).then((r) => { PL.files = r.files; if (!r.files.length && PL.tab === 'import') PL.tab = 'generate'; drawPlan(); }, (e) => toast(e.message, true));
  if (!PL.job) api('GET', `repos/${encodeURIComponent(repo)}/generate`).then((r) => { PL.job = r.job; drawPlan(); watchJob(); });
}
function watchJob() {
  clearInterval(PL.timer);
  if (PL.job?.status !== 'running') return;
  const repo = PL.repo;
  PL.timer = setInterval(async () => {
    try { PL.job = (await api('GET', `repos/${encodeURIComponent(repo)}/generate`)).job; } catch { return; }
    if (PL.job?.status !== 'running') { clearInterval(PL.timer); if (PL.job?.status === 'done') toast(`Claude proposed ${PL.job.items.length} ticket(s)`); }
    if ($('#dlg').open && PL.repo === repo && PL.tab === 'generate') drawPlan();
  }, 3000);
}
function planItem(it, i, checked) {
  return `<div class="plitem ${it.ticket ? 'off' : ''}">
    <input type="checkbox" data-i="${i}" ${checked && !it.ticket ? 'checked' : ''} ${it.ticket ? 'disabled' : ''}>
    <div style="flex:1;min-width:0">
      <div class="row" style="gap:6px">${it.key ? `<span class="chip mono">${esc(it.key)}</span>` : ''}<input class="pltitle" data-i="${i}" value="${esc(it.title)}">
        ${it.ticket ? `<span class="chip">already ${it.ticket.id} · ${(ST[it.ticket.status] || [it.ticket.status])[0]}</span>` : ''}${it.superseded ? '<span class="pill t-neutral"><i></i>superseded</span>' : ''}</div>
      <details><summary>Description</summary><textarea class="pldesc" data-i="${i}" rows="6">${esc(it.description)}</textarea></details>
    </div></div>`;
}
function drawPlan() {
  const nFiles = PL.files ? PL.files.reduce((n, f) => n + f.items.length, 0) : '';
  $('#plTabs').innerHTML = [['import', `${ic('list')}From plan files <span class="faint">${nFiles}</span>`], ['generate', `${ic('spark')}Generate with Claude`]]
    .map(([k, l]) => `<button type="button" class="${PL.tab === k ? 'on' : ''}" onclick="PL.tab='${k}';drawPlan()">${l}</button>`).join('');
  const body = $('#plBody');
  PL.list = [];
  if (PL.tab === 'import') {
    if (!PL.files) body.innerHTML = '<div class="row muted"><span class="spinner"></span>Reading .wiki/plans…</div>';
    else if (!PL.files.length) body.innerHTML = '<div class="empty">No plan files with tickets in <code>.wiki/plans/</code>. Use <b>Generate with Claude</b>, or run <code>/kit-new</code> to write an MVP plan.</div>';
    else body.innerHTML = PL.files.map((f) => {
      const start = PL.list.length;
      PL.list.push(...f.items);
      return `<div class="row" style="margin:6px 0 8px"><b class="mono small">${esc(f.file)}</b><span class="count">${f.items.length}</span><span class="grow"></span>
          <button type="button" class="small ghost" onclick="planCheck(${start},${PL.list.length},true)">Select new</button><button type="button" class="small ghost" onclick="planCheck(${start},${PL.list.length},false)">None</button></div>
        ${f.items.map((it, j) => planItem(it, start + j, false)).join('')}`;
    }).join('');
  } else {
    const j = PL.job;
    body.innerHTML = `<label style="margin-top:0">What do you want to build?</label>
      <textarea id="plGoal" rows="4" style="font-family:var(--sans);font-size:13px" placeholder="e.g. Add a watchlist page: save symbols, show live price + funding, alert when price crosses a level" ${j?.status === 'running' ? 'disabled' : ''}>${esc(j?.goal || '')}</textarea>
      <div class="row" style="margin:10px 0 14px"><button type="button" class="primary small" id="plGen" ${j?.status === 'running' ? 'disabled' : ''}>${ic('spark')}${j?.status === 'done' ? 'Generate again' : 'Generate tickets'}</button>
        <span class="small faint">Uses the plan engine (${esc(S.config.engines.plan.model || 'claude')}), read-only in the repo · existing tickets are not repeated</span></div>
      ${j?.status === 'running' ? `<div class="hint"><span class="spinner"></span><span>Claude is reading the repo and splitting the goal into tickets, usually 1–3 min. You can close this window; it keeps going.</span></div>` : ''}
      ${j?.status === 'failed' ? `<div class="box err"><pre>${esc(j.error)}</pre></div>` : ''}
      ${j?.status === 'done' ? `<div class="row small muted" style="margin-bottom:8px">Proposed ${j.items.length} ticket(s) · Claude ≈ $${(j.costUsd || 0).toFixed(3)}${j.tokens ? ` · 🪙 ${kTok(j.tokens.in + j.tokens.out)} tokens` : ''} · edit titles or descriptions before adding</div>${j.items.map((it, i) => planItem(it, i, true)).join('')}` : ''}`;
    if (j?.status === 'done') PL.list = j.items;
    $('#plGen').onclick = guard(async () => {
      PL.job = await api('POST', `repos/${encodeURIComponent(PL.repo)}/generate`, { goal: $('#plGoal').value });
      drawPlan(); watchJob();
    });
  }
  const n = () => [...document.querySelectorAll('#plBody input[type=checkbox]:checked')].length;
  $('#plFoot').innerHTML = PL.list.length ? `<div class="row" style="margin-top:16px;padding-top:14px;border-top:1px solid var(--line)">
      <span class="small muted">Add <b id="plN">${n()}</b> selected as</span>
      <select id="plThen" style="width:auto"><option value="backlog">Backlog</option><option value="plan">Backlog + write plans now</option><option value="run">Queue now (plan + code)</option></select>
      <span class="grow"></span><button type="button" class="primary" id="plAdd">${ic('plus')}Add tickets</button></div>` : '';
  $('#plBody').onchange = () => { if ($('#plN')) $('#plN').textContent = n(); };
  if ($('#plAdd')) $('#plAdd').onclick = guard(async () => {
    const items = [...document.querySelectorAll('#plBody input[type=checkbox]:checked')].map((c) => {
      const i = +c.dataset.i;
      return { title: $(`.pltitle[data-i="${i}"]`).value, description: $(`.pldesc[data-i="${i}"]`).value, source: PL.list[i].source || '' };
    });
    const then = $('#plThen').value;
    const made = await api('POST', 'tickets/bulk', { repo: PL.repo, items, then });
    toast(`${made.length} ticket(s) added${then === 'plan' ? ' — writing plans' : then === 'run' ? ' and queued' : ' to the backlog'}`);
    PL.files = null; if (PL.tab === 'generate') PL.job = null;
    $('#dlg').close(); await refresh();
    if (page.v === 'repos') drawRepoTickets(); else location.hash = `#/repos/${encodeURIComponent(PL.repo)}`;
  });
}
function planCheck(from, to, on) {
  document.querySelectorAll('#plBody input[type=checkbox]').forEach((c) => { const i = +c.dataset.i; if (i >= from && i < to && !c.disabled) c.checked = on && !PL.list[i].superseded; });
  $('#plBody').onchange();
}

// ---------------- editor (shared by repos + kit) ----------------
function editorHtml(f, saveLabel) {
  return `<div class="row" style="margin-bottom:8px"><code>${esc(f.path)}</code>${f.writable ? '' : '<span class="chip">read-only</span>'}<span class="grow"></span>
      ${f.writable ? `<button class="primary small" id="edSave">${saveLabel}</button>` : ''}</div>
    <textarea id="ed" rows="28" ${f.writable ? '' : 'readonly'}>${esc(f.text)}</textarea><div id="edOut" class="small" style="margin-top:8px"></div>`;
}
function bindEditor(save) {
  const go = guard(async () => { const out = await save($('#ed').value); $('#edOut').innerHTML = out || '<span class="b-ok">Saved</span>'; });
  if ($('#edSave')) $('#edSave').onclick = go;
  if ($('#ed')) $('#ed').onkeydown = (e) => { if (e.ctrlKey && e.key === 's') { e.preventDefault(); go(); } };
}

// ---------------- repos ----------------

async function viewRepos(name) {

}

  const list = `<div class="panel list">${S.repos.map((r) => {

      <div class="small muted" style="word-break:break-all">${esc(r.path)}</div>

  $('#view').innerHTML = `<div class="split">${list}<div>
    <div class="panel">

      ${R.paused ? '<div class="warnbar" style="margin:14px 0 0">⏸ <div>This repo is <b>paused</b>: queued tickets wait until you resume it under Autopilot.</div></div>' : ''}
      <div id="repoTickets" style="margin-top:18px">${repoTicketsHtml()}</div>

      <div class="row" style="margin-top:10px"><button class="primary small" onclick="saveRepo()">Save</button><span class="small muted">In use → setup: <code>${esc(R.resolved.setup || '—')}</code> · verify: <code>${esc(R.resolved.verify.join(' && ') || '—')}</code></span>

      <div class="row" style="margin-top:10px"><button class="small" onclick="syncRepo(true)">Preview sync</button><button class="small primary" onclick="syncRepo(false)">Sync</button><button class="small" onclick="syncRepo(false, true)">Force sync</button><button class="small" onclick="doctorRepo()">Doctor</button></div>

}
const addRepo = guard(async () => { const r = await api('POST', 'repos', { path: $('#addPath').value.trim() }); toast(r.text); await refresh(); viewRepos(S.repos.at(-1)?.name); });
const ADV_KEYS = ['workspace', 'wiki', 'worktree', 'branch', 'fetchBase', 'test', 'agents', 'commands'];
const advanced = (r) => Object.fromEntries(ADV_KEYS.filter((k) => r[k] !== undefined).map((k) => [k, r[k]]));
const saveRepo = guard(async () => {
  const lines = $('#rVerify').value.split('\n').map((s) => s.trim()).filter(Boolean);
  let adv;
  try { adv = JSON.parse($('#rAdv').value.trim() || '{}'); } catch (e) { throw new Error(`Advanced: ${e.message}`); }
  R = await api('PUT', `repos/${encodeURIComponent(R.name)}`, { base: $('#rBase').value.trim(), setup: $('#rSetup').value.trim() || null, verify: $('#rNoVerify').checked ? [] : lines.length ? lines : null,
    advanced: adv, paused: $('#rPaused').checked, autoRun: $('#rAutoRun').checked, autoApprove: $('#rAutoApprove').checked, autoMerge: $('#rAutoMerge').checked, mergeMethod: $('#rMerge').value });
  await refresh(); toast('Saved'); drawRepo();
});
// ---------------- e2e (Playwright on the latest base; failing tests → bug tickets) ----------------
const E2E_ST = { running: ['Running', 'accent'], passed: ['Passed', 'ok'], failed: ['Failed', 'bad'], error: ['Error', 'bad'], interrupted: ['Interrupted', 'warn'] };
const tlinks = (ids) => ids.map((id) => `<a href="#/ticket/${id}">${id}</a>`).join(' ');
function e2eStatus(E) {
  const l = E.last;
  if (!E.enabled) return '<span class="muted">No Playwright config found. Add <code>playwright.config.ts</code> to the repo, or set the command below.</span>';
  if (!l) return '<span class="muted">Not run yet.</span>';
  const [label, tone] = E2E_ST[l.status] || [l.status, 'neutral'];
  return `<span class="pill t-${tone}${l.status === 'running' ? ' live' : ''}"><i></i>${label}</span><span>${ago(l.at)} on <code>${esc(l.base)}${l.sha ? ` @ ${esc(l.sha.slice(0, 7))}` : ''}</code></span>
    ${l.status !== 'running' && l.status !== 'error' ? `<span>${l.passed} passed · <b style="${l.failed ? 'color:var(--bad)' : ''}">${l.failed} failed</b>${l.flaky ? ` · ${l.flaky} flaky` : ''}${l.skipped ? ` · ${l.skipped} skipped` : ''}</span>` : ''}
    ${l.filed?.length ? `<span>new bugs ${tlinks(l.filed)}</span>` : ''}${l.still?.length ? `<span>still failing ${tlinks(l.still)}</span>` : ''}${l.verified?.length ? `<span>verified ${tlinks(l.verified)}</span>` : ''}
    ${l.error ? `<span class="errline" style="flex-basis:100%">${esc(l.error.split('\n')[0])}</span>` : ''}`;
}
function e2eHtml(E) {
  const run = E.last?.status === 'running';
  return `<h3>End-to-end tests <span class="faint" style="font-weight:400">— Playwright on the latest <code>${esc(R.base || 'main')}</code>, shell only (no tokens)</span></h3>
    <div class="box" style="background:var(--panel)">
      <div class="row small" id="e2eStatus">${e2eStatus(E)}</div>
      <div class="row" style="margin-top:10px"><button class="small primary" onclick="runE2e()" ${!E.enabled || run ? 'disabled' : ''}>${ic('play')}${run ? 'Running…' : 'Run now'}</button><button class="small" onclick="showE2eLog()">Log</button>
        <span class="small faint">Each failing test → one bug ticket with its failure screenshot. When a fixed bug's test passes again, the bug is marked Verified.</span></div>
      <div class="grid3">
        <div><label>Command <span class="faint">(empty = auto)</span></label><input id="eCmd" value="${E.detected ? '' : esc(E.cmd)}" placeholder="${esc(E.cmd || 'npx playwright test')}"></div>
        <div><label>Folder <span class="faint">(of playwright.config)</span></label><input id="eDir" value="${E.detected ? '' : esc(E.dir)}" placeholder="${esc(E.dir)}"></div>
        <div><label>Run every <span class="faint">(hours; 0 = only on Run)</span></label><input type="number" min="0" id="eEvery" value="${E.everyHours}"></div>
      </div>
      <div class="grid3">
        <div><label>Severity of filed bugs</label><select id="eSev">${['low', 'medium', 'high', 'critical'].map((s) => `<option ${E.severity === s ? 'selected' : ''}>${s}</option>`).join('')}</select></div>
        <div><label>Group into one bug above <span class="faint">(failures)</span></label><input type="number" min="1" id="eMax" value="${E.maxBugs}"></div>
      </div>
      <label class="check"><input type="checkbox" id="eFile" ${E.fileBugs ? 'checked' : ''}><span><b>File bug tickets</b> <span class="muted">— off: just report pass/fail</span></span></label>
      <label class="check"><input type="checkbox" id="eAuto" ${E.autoFix ? 'checked' : ''}><span><b>Start fixing right away</b> <span class="muted">— filed bugs go to the queue instead of the backlog (spends plan tokens)</span></span></label>
      <label class="check"><input type="checkbox" id="eVerify" ${E.inVerify ? 'checked' : ''}><span><b>Also run in each ticket's Verify step</b> <span class="muted">— catches regressions before review; slower tickets</span></span></label>
      <p class="small faint" style="margin:10px 0 0">Screenshots need <code>use: { screenshot: 'only-on-failure' }</code> in the Playwright config; <code>webServer</code> starts the app (runs with <code>CI=1</code>). Keep the viewport ≤1568px wide so a screenshot stays ≈1.8k tokens or less.</p>
      <div class="row" style="margin-top:10px"><button class="small primary" onclick="saveE2e()">Save e2e settings</button></div>
      <pre id="e2eOut" class="box" style="margin-top:10px;display:none;max-height:380px;overflow:auto"></pre>
    </div>`;
}
const saveE2e = guard(async () => {
  R = await api('PUT', `repos/${encodeURIComponent(R.name)}`, { e2e: { cmd: $('#eCmd').value, dir: $('#eDir').value || '.', everyHours: $('#eEvery').value, severity: $('#eSev').value,
    maxBugs: $('#eMax').value, fileBugs: $('#eFile').checked, autoFix: $('#eAuto').checked, inVerify: $('#eVerify').checked } });
  toast('E2E settings saved'); drawRepo();
});
let e2eTimer = null;
async function watchE2e(name) {
  clearTimeout(e2eTimer);
  if (page.v !== 'repos' || R?.name !== name) return;
  const { last, log } = await api('GET', `repos/${encodeURIComponent(name)}/e2e`);
  R.e2e.last = last;
  if ($('#e2eStatus')) $('#e2eStatus').innerHTML = e2eStatus(R.e2e);
  const out = $('#e2eOut');
  if (out && out.style.display !== 'none') { const end = out.scrollTop + out.clientHeight >= out.scrollHeight - 30; out.textContent = log || '(empty)'; if (end) out.scrollTop = out.scrollHeight; }
  if (last?.status === 'running') e2eTimer = setTimeout(() => watchE2e(name), 3000);
  else { await refresh(); drawRepo(); if (last?.filed?.length) toast(`${last.filed.length} bug ticket(s) filed from e2e`); }
}
const runE2e = guard(async () => {
  await api('POST', `repos/${encodeURIComponent(R.name)}/e2e`, {});
  toast('E2E run started'); $('#e2eOut').style.display = 'block'; watchE2e(R.name);
});
const showE2eLog = guard(async () => { const o = $('#e2eOut'); o.style.display = o.style.display === 'none' ? 'block' : 'none'; if (o.style.display === 'block') await watchE2e(R.name); });

function repoTicketsHtml() {
  const ts = S.tickets.filter((t) => t.repo === R.name).sort(byIndex);
  const backlog = ts.filter((t) => t.status === 'backlog').length;
  const unplanned = ts.filter((t) => t.status === 'backlog' && !t.planned).length;
  const planBtn = (t) => t.status === 'backlog' ? `<button class="small ghost" onclick="repoAct('${t.id}','plan')" title="${t.planned ? 'Write the brief again' : 'Write the brief only; code later'}">${ic('pen')}${t.planned ? 'Re-plan' : 'Plan'}</button>` : '';
  const rowAct = (t) => ['backlog', 'failed'].includes(t.status) ? `<span class="row" style="flex-wrap:nowrap;justify-content:flex-end">${planBtn(t)}<button class="small primary" onclick="repoAct('${t.id}','run')">${ic('play')}${t.status === 'failed' ? 'Retry' : 'Start'}</button></span>`
    : t.status === 'ready' ? `<button class="small" onclick="repoAct('${t.id}','stop')">${ic('stop')}Unqueue</button>`
    : t.status === 'running' ? `<button class="small danger" onclick="repoAct('${t.id}','stop')">${ic('stop')}Stop</button>`
    : `<a class="btn small" href="#/ticket/${t.id}">Open</a>`;
  return `<div class="row"><b>Tickets</b><span class="count">${ts.length}</span><span class="grow"></span>
      ${unplanned ? `<button class="small" onclick="planBacklog()" title="Write briefs for backlog tickets that have none; nothing is coded">${ic('pen')}Plan all backlog (${unplanned})</button>` : ''}
      ${backlog ? `<button class="small" onclick="startBacklog()">${ic('play')}Start all backlog (${backlog})</button>` : ''}
      <button class="small" onclick="planTickets()">${ic('list')}Plan tickets…</button>
      <button class="small primary" onclick="newTicket()">${ic('plus')}New ticket</button></div>
    ${ts.length ? `<div class="tablewrap"><table>${ts.map((t) => `<tr>
        <td class="mono small faint" style="width:56px">${t.id}</td>
        <td><a href="#/ticket/${t.id}" style="color:var(--text);font-weight:500">${esc(t.title)}</a>${t.status === 'backlog' && t.planned ? ` <a class="chip" href="#/ticket/${t.id}" title="open the plan">${ic('pen')}plan ready</a>` : ''}${t.pr ?` <a class="chip" href="${esc(t.pr)}" target="_blank" rel="noopener">${ic('pr')}#${prNum(t.pr) || 'PR'}</a>` : ''}</td>
        <td style="width:1%" title="${esc(t.waiting || '')}">${pill(t.status, t.stage)}${['ready', 'backlog'].includes(t.status) && t.waiting ? `<div class="small faint" style="white-space:nowrap;margin-top:3px">⏳ ${esc(t.waiting)}</div>` : ''}</td><td class="small faint" style="white-space:nowrap;width:1%">${ago(t.updatedAt)}</td>
        <td style="text-align:right;width:1%">${rowAct(t)}</td></tr>`).join('')}</table></div>`
      : '<div class="empty" style="margin-top:10px">No tickets for this repo yet. Create one, or run <code>/ticket</code> inside the repo.</div>'}`;
}
const drawRepoTickets = () => { const el = $('#repoTickets'); if (el && R) el.innerHTML = repoTicketsHtml(); };
const repoAct = guard(async (id, a) => { const t = await api('POST', `tickets/${id}/action/${a}`, {}); await refresh(); drawRepoTickets(); toast(`${id} → ${(ST[t.status] || [t.status])[0]}`); });
const planBacklog = guard(async () => {
  const ids = S.tickets.filter((t) => t.repo === R.name && t.status === 'backlog' && !t.planned).map((t) => t.id);
  for (const id of ids) await api('POST', `tickets/${id}/action/plan`, {});
  await refresh(); drawRepoTickets(); toast(`Planning ${ids.length} ticket(s); they come back to the backlog with a plan`);
});
const startBacklog = guard(async () => {
  const ids = S.tickets.filter((t) => t.repo === R.name && t.status === 'backlog').map((t) => t.id);
  for (const id of ids) await api('POST', `tickets/${id}/action/run`, {});
  await refresh(); drawRepoTickets(); toast(`${ids.length} ticket(s) queued${R.paused ? ' (repo is paused)' : ''}`);
});
const removeRepo = guard(async () => { if (!confirm(`Remove ${R.name} from the hub? (files are not touched)`)) return; await api('DELETE', `repos/${encodeURIComponent(R.name)}`); await refresh(); location.hash = '#/repos'; R = null; viewRepos(); });
const syncRepo = guard(async (dry, force) => {
  if (force && !confirm('Force sync overwrites locally modified kit files. Continue?')) return;
  const r = await api('POST', `repos/${encodeURIComponent(R.name)}/sync`, { dry, force });
  if (!dry) { R = r.info; drawRepo(); }
  const o = $('#repoOut'); o.style.display = ''; o.textContent = r.text;
});
const doctorRepo = guard(async () => { const r = await api('GET', `repos/${encodeURIComponent(R.name)}/doctor`); const o = $('#repoOut'); o.style.display = ''; o.textContent = r.text; });
const openRepoFile = guard(async (path) => {
  const f = await api('GET', `repos/${encodeURIComponent(R.name)}/file?path=${encodeURIComponent(path)}`);
  const el = $('#repoEd'); el.style.display = '';
  el.innerHTML = editorHtml(f, 'Save') + (f.writable ? '' : '<p class="small muted">Synced from the kit. Use "Override" to customise it for this repo, or edit the source in the Kit tab.</p>');
  bindEditor(async (text) => { await api('PUT', `repos/${encodeURIComponent(R.name)}/file`, { path, text }); return path.startsWith('.kit/local/') ? '<span class="b-ok">Saved</span> — click <b>Sync</b> to apply it to .claude/.opencode' : ''; });
  el.scrollIntoView({ behavior: 'smooth' });
});
const overrideItem = guard(async (kind, name) => {
  const r = await api('POST', `repos/${encodeURIComponent(R.name)}/override`, { kind, name });
  R = await api('GET', `repos/${encodeURIComponent(R.name)}`); drawRepo();
  toast(`Copied to ${r.path}; edit, then Sync`); openRepoFile(r.path);
});

// ---------------- kit ----------------
let K = null;
async function viewKit(path) {
  K = K || await api('GET', 'kit/catalog');
  const groups = ['agents', 'commands', 'skills', 'packs', 'hooks'];
  const list = groups.map((g) => `<div class="grp">${g}</div>${K.items.filter((i) => i.kind === g).map((i) => {
    const over = i.budget && i.lines > i.budget;
    return `<a href="#/kit/${encodeURIComponent(i.path)}" class="${i.path === path ? 'on' : ''}" title="${esc(i.description)}"><div class="row"><b>${esc(i.name)}</b>${i.model ? `<span class="chip">${esc(i.model)}</span>` : ''}${i.targets ? `<span class="chip">${esc(i.targets.join('/'))} only</span>` : ''}<span class="grow"></span><span class="small ${over ? 'b-over' : 'faint'}">${i.lines}${i.budget ? `/${i.budget}` : ''}</span></div></a>`;
  }).join('')}`).join('') + `<div class="grp">config &amp; templates</div>${K.files.map((f) => `<a href="#/kit/${encodeURIComponent(f)}" class="${f === path ? 'on' : ''}"><span class="small">${esc(f)}</span></a>`).join('')}`;
  $('#view').innerHTML = `<div class="split"><div class="panel list" style="max-height:80vh;overflow:auto">
      <div class="row" style="padding:4px 10px"><b>Kit ${esc(K.version)}</b><span class="grow"></span><button class="small" onclick="kitLint()">Lint</button></div>${list}</div>
    <div class="panel" id="kitEd"><p class="muted" style="margin-top:0">Pick an agent, command, skill or pack. These are the sources: edits reach a repo when you <b>Sync</b> it (Repos tab). Numbers are body lines / budget.</p><pre id="kitOut" class="box" style="display:none"></pre></div></div>`;
  if (path) {
    const f = await api('GET', `kit/file?path=${encodeURIComponent(path)}`);
    const item = K.items.find((i) => i.path === path);
    $('#kitEd').innerHTML = (item?.description ? `<p class="small muted" style="margin-top:0">${esc(item.description)}</p>` : '') + editorHtml(f, 'Save + lint');
    bindEditor(async (text) => { const r = await api('PUT', 'kit/file', { path, text }); K = null; return `<pre class="${r.lint === 'lint: ok' ? 'b-ok' : 'b-over'}">${esc(r.lint)}</pre>`; });
  }
}
const kitLint = guard(async () => { const r = await api('GET', 'kit/lint'); const o = $('#kitOut') || $('#edOut'); if (o) { o.style.display = ''; o.textContent = r.text; } else toast(r.text); });

// ---------------- settings ----------------
function viewSettings() {
  const c = S.config;
  const eng = (k, label) => `<div><label>${label}</label><div class="row" style="flex-wrap:nowrap">
      <select id="e_${k}_tool" style="width:120px"><option ${c.engines[k].tool === 'claude' ? 'selected' : ''}>claude</option><option ${c.engines[k].tool === 'opencode' ? 'selected' : ''}>opencode</option></select>
      <input id="e_${k}_model" list="models" value="${esc(c.engines[k].model)}" placeholder="default"></div>
      <input id="e_${k}_agent" value="${esc(c.engines[k].agent || '')}" placeholder="agent (optional)" style="margin-top:4px"></div>`;
  const num = (sec, k, label) => `<div><label>${label}</label><input type="number" id="n_${sec}_${k}" value="${c[sec][k]}"></div>`;
  const cur = theme();
  $('#view').innerHTML = `<div class="pagehead"><div><h2>Settings</h2><p class="small muted">Stored in ~/.kit-hub/hub.json. Applies to the next stage that starts.</p></div></div>
    <div class="panel" style="max-width:900px">
    <datalist id="models"><option>opus</option><option>sonnet</option><option>haiku</option><option>opencode/big-pickle</option></datalist>
    <h3 style="margin-top:0">Appearance</h3>
    <div class="seg">${THEMES.map(([k, icon, label]) => `<button type="button" class="${k === cur ? 'on' : ''}" onclick="theme('${k}');viewSettings()">${ic(icon)}${label.replace(' theme', '')}</button>`).join('')}</div>
    <span class="small faint" style="margin-left:8px">saved in this browser</span>
    <h3>Engines</h3><p class="small muted">An agent is a Claude Code agent name (<code>claude --agent</code>); a repo's or ticket's agents override it.</p>
    <div class="grid3">${eng('plan', 'Plan (once per ticket)')}${eng('code', 'Code + fixes')}${eng('review', 'Review')}${eng('test', 'Test (repos with test on)')}</div>
    <div class="grid3"><div style="grid-column:span 2"><label>Finished-ticket report <span class="faint" style="font-weight:400">— plain language + engineer notes for Telegram, the Result tab and the PR</span></label>
      <div class="row" style="flex-wrap:nowrap"><select id="e_summary_tool" style="width:120px"><option ${(c.engines.summary?.tool || 'claude') === 'claude' ? 'selected' : ''}>claude</option><option value="off" ${c.engines.summary?.tool === 'off' ? 'selected' : ''}>off</option></select>
      <input id="e_summary_model" list="models" value="${esc(c.engines.summary?.model ?? 'haiku')}" placeholder="haiku"></div></div>
      <div><label>Escalate coding after N failed attempts <span class="faint" style="font-weight:400">(0 = off)</span></label>
      <div class="row" style="flex-wrap:nowrap"><input type="number" min="0" id="esc_after" value="${c.engines.escalate?.after ?? 0}" style="width:70px"><select id="e_escalate_tool" style="width:110px"><option ${(c.engines.escalate?.tool || 'claude') === 'claude' ? 'selected' : ''}>claude</option><option ${c.engines.escalate?.tool === 'opencode' ? 'selected' : ''}>opencode</option></select>
      <input id="e_escalate_model" list="models" value="${esc(c.engines.escalate?.model ?? 'sonnet')}" placeholder="sonnet"></div></div></div>
    <div class="grid3"><div style="grid-column:span 2"><label>Resolve PR conflicts <span class="faint" style="font-weight:400">— auto-merge repos: merge the base into a conflicting PR, resolve, verify, push</span></label>
      <div class="row" style="flex-wrap:nowrap"><select id="e_resolve_tool" style="width:120px">${['claude', 'opencode', 'off'].map((k) => `<option ${(c.engines.resolve?.tool || 'claude') === k ? 'selected' : ''}>${k}</option>`).join('')}</select>
      <input id="e_resolve_model" list="models" value="${esc(c.engines.resolve?.model ?? 'opus')}" placeholder="opus"></div></div></div>
    <h3>Limits</h3><div class="grid3">${num('limits', 'maxParallel', 'Coding tickets in parallel (1 per repo)')}${num('limits', 'maxPlanning', 'Plan-only runs in parallel (0 = queue like coding)')}${num('limits', 'fixIterations', 'Verify-fix attempts')}${num('limits', 'reviewRounds', 'Review fix rounds')}
      ${num('limits', 'stageTimeoutMin', 'Stage timeout (min)')}${num('limits', 'claudeBudgetUsd', 'Max $ per Claude call')}${num('review', 'skipUnderLines', 'Skip review under N lines')}</div>
    <h3>Worktrees</h3><div class="grid2"><div><label>Folder for ticket worktrees <span class="faint" style="font-weight:400">(empty = ~/.kit-hub/worktrees; applies to new worktrees)</span></label><input id="wtDir" value="${esc(c.worktreeDir || '')}" placeholder="D:/kit-worktrees"></div></div>
    <h3>Pull requests &amp; notifications</h3>
    <div class="grid3"><div><label>PR</label><label class="check" style="margin-top:8px"><input type="checkbox" id="prDraft" ${c.pr.draft ? 'checked' : ''}> Open as draft</label></div>
      <div><label>ntfy topic</label><input id="ntfyTopic" value="${esc(c.ntfy.topic)}" placeholder="off"></div>
      <div><label>Telegram</label><div class="small" style="padding-top:8px">${c.telegram.enabled ? `<span class="pill t-ok"><i></i>on · ${c.telegram.paired} paired chat(s)</span>` : 'off — run <code>kit hub telegram &lt;token&gt;</code>'}</div></div></div>
    <h3>Import &amp; notify</h3><div class="grid2">
      <div><label>Import command <span class="faint" style="font-weight:400">(prints a JSON list of tickets)</span></label><input id="impCmd" value="${esc(c.import.command)}" placeholder="off"></div>
      <div><label>Notify button label</label><input id="notifyLabel" value="${esc(c.ui.notifyLabel || '')}" placeholder="Notify"></div></div>
    <div class="row" style="margin-top:22px"><button class="primary" onclick="saveSettings()">Save settings</button></div></div>`;
}
const saveSettings = guard(async () => {
  const e = (k) => ({ tool: $(`#e_${k}_tool`).value, model: $(`#e_${k}_model`).value.trim(), ...($(`#e_${k}_agent`) ? { agent: $(`#e_${k}_agent`).value.trim() } : {}) });
  const n = (sec, k) => Number($(`#n_${sec}_${k}`).value);
  S.config = await api('PUT', 'config', {
    engines: { plan: e('plan'), code: e('code'), review: e('review'), test: e('test'), summary: e('summary'), resolve: e('resolve'), escalate: { ...e('escalate'), after: Number($('#esc_after').value) || 0 } },
    import: { command: $('#impCmd').value.trim() }, ui: { notifyLabel: $('#notifyLabel').value.trim() },
    limits: { maxParallel: n('limits', 'maxParallel'), maxPlanning: n('limits', 'maxPlanning'), fixIterations: n('limits', 'fixIterations'), reviewRounds: n('limits', 'reviewRounds'), stageTimeoutMin: n('limits', 'stageTimeoutMin'), claudeBudgetUsd: n('limits', 'claudeBudgetUsd') },
    review: { skipUnderLines: n('review', 'skipUnderLines') }, worktreeDir: $('#wtDir').value, pr: { draft: $('#prDraft').checked }, ntfy: { topic: $('#ntfyTopic').value.trim() },
  });
  toast('Settings saved');
});

// ---------------- shell ----------------
async function refresh() {
  S = await api('GET', 'state');
  const p = S.daemon.paused;
  const active = S.tickets.filter((t) => t.status === 'running').length;
  $('#loop').innerHTML = `<span class="row" style="gap:7px;flex-wrap:nowrap"><span class="dot ${p ? 'paused' : 'on'}"></span><span class="txt">Loop ${p ? 'paused' : 'running'} · ${active} active</span></span>`;
  $('#loopBtn').innerHTML = p ? `${ic('play')}Resume` : `${ic('pause')}Pause`;
  $('#loopBtn').title = p ? 'Resume the loop' : 'Pause the loop (running tickets finish)';
  $('#importBtn').style.display = S.config.import.command ? '' : 'none'; // optional: only with an import command
}
$('#loopBtn').onclick = guard(async () => { await api('POST', 'loop', { paused: !S.daemon.paused }); await refresh(); toast(S.daemon.paused ? 'Loop paused (running tickets finish)' : 'Loop resumed'); });

async function render() {
  const [v, ...rest] = location.hash.replace(/^#\/?/, '').split('/');
  const arg = decodeURIComponent(rest.join('/'));
  page.v = v || 'board';
  document.querySelectorAll('#nav a').forEach((a) => a.classList.toggle('on', a.dataset.v === (page.v === 'ticket' ? 'board' : page.v)));
  try {
    if (page.v === 'board') viewBoard();
    else if (page.v === 'prs') await viewPrs();
    else if (page.v === 'ticket') await viewTicket(arg);
    else if (page.v === 'repos') { page.name = arg; await viewRepos(arg); }
    else if (page.v === 'kit') await viewKit(arg);
    else if (page.v === 'settings') viewSettings();
  } catch (e) { $('#view').innerHTML = `<div class="box err"><pre>${esc(e.message)}</pre></div>`; }
  window.scrollTo({ top: 0 });
}

const typing = () => ['TEXTAREA', 'INPUT', 'SELECT'].includes(document.activeElement?.tagName) || $('#dlg').open;

// Live updates without stealing focus from editors.
async function poll() {
  try {
    const before = JSON.stringify(S.tickets);
    await refresh();
    const changed = before !== JSON.stringify(S.tickets);
    if (page.v === 'board' && (changed || S.tickets.some((t) => t.status === 'running')) && !typing()) viewBoard(); // running: keep elapsed time fresh
    if (page.v === 'repos' && changed) drawRepoTickets();
    if (page.v === 'ticket' && T) {
      const s = S.tickets.find((t) => t.id === T.id);
      if (s && (changed || s.status === 'running') && !typing()) {
        if (page.tab === 'logs' && s.status === 'running' && s.updatedAt === T.updatedAt) { if (page.log) loadLog(page.log); }
        else await viewTicket(T.id, true);
      }
    }
  } catch { $('#loop').innerHTML = '<span class="row" style="gap:7px"><span class="dot"></span><span class="txt">Daemon unreachable</span></span>'; }
}
async function pollPrs() {
  try {
    const hadOpen = P && P.prs.filter((p) => p.state === 'OPEN').length;
    await loadPrs();
    if (page.v === 'prs' && !typing()) viewPrs();
    else if (page.v === 'board' && hadOpen !== P.prs.filter((p) => p.state === 'OPEN').length && !typing()) viewBoard();
  } catch { /* gh unavailable; the PR page shows the error */ }
}

document.addEventListener('keydown', (e) => {
  if (e.ctrlKey || e.metaKey || e.altKey || typing()) return;
  if (['n', 'b'].includes(e.key.toLowerCase())) { e.preventDefault(); newTicket(e.key.toLowerCase() === 'b' ? 'bug' : 'feature'); }
  else if (e.key === '[' || e.key === ']') { e.preventDefault(); gotoNeighbour(e.key === '[' ? -1 : 1); }
});
window.addEventListener('hashchange', render);
refresh().then(render).then(pollPrs);
setInterval(poll, 3000);
setInterval(pollPrs, 60000);
</script>
